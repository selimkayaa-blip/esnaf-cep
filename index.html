<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esnaf Cep • Bulut Test</title><style>body{font-family:system-ui;background:#f4f6f8;color:#17212b;margin:0}header{background:#1f2937;color:white;padding:20px;font-size:22px;font-weight:700}main{max-width:650px;margin:24px auto;padding:0 16px}.card{background:white;padding:22px;border-radius:16px;box-shadow:0 3px 15px #0001;margin-bottom:14px}input,button{font:inherit;padding:13px;border-radius:10px;width:100%;box-sizing:border-box;margin:7px 0;border:1px solid #ddd}button{background:#1f2937;color:white;font-weight:bold;cursor:pointer}.yellow{background:#f4c542;color:#111}small{color:#667085}#app{display:none}.entry{border-bottom:1px solid #eee;padding:12px 0}.error{color:#b42318;white-space:pre-wrap}.ok{color:#176b3a}</style></head><body><header>ESNAF CEP ☁️ <small style="color:#eee">Bulut Bağlantı Testi</small></header><main><div id="login" class="card"><h2>Giriş Yap</h2><input id="email" type="email" autocomplete="username" placeholder="E-posta"><input id="password" type="password" autocomplete="current-password" placeholder="Şifre"><button id="loginBtn">Giriş Yap</button><p id="loginMsg" role="status"></p><small>Bu sürüm yalnızca bulut girişini ve müşteri kayıtlarını test eder. Mevcut Esnaf Cep verilerini değiştirmez.</small></div><div id="app"><div class="card"><h2 id="firm">Firma</h2><div id="who"></div><button id="logout">Çıkış Yap</button></div><div class="card"><h3>Bulut Müşteri Testi</h3><input id="customerName" placeholder="Müşteri adı"><button class="yellow" id="add">Müşteriyi Buluta Kaydet</button><p id="status" role="status"></p><div id="customers"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const URL='https://dskddjsaixsxlqpztdmv.supabase.co';
const KEY='sb_publishable_tfNlmO2WEaw-j6-6neU9-g_JNIvzGCv';
const $=id=>document.getElementById(id);
let client,firmId;
function msg(id,text,ok=false){$(id).textContent=text;$(id).className=ok?'ok':'error'}
function errorText(e){return e?.message||'Bilinmeyen hata'}
async function showSession(){const {data:{user},error}=await client.auth.getUser();if(error||!user){$('login').style.display='block';$('app').style.display='none';return}const {data:members,error:me}=await client.from('firm_members').select('firm_id').eq('user_id',user.id).limit(1);if(me)throw me;if(!members?.length)throw Error('Bu kullanıcıya firma üyeliği atanmadı.');firmId=members[0].firm_id;const {data:f,error:fe}=await client.from('firms').select('name').eq('id',firmId).single();if(fe)throw fe;$('firm').textContent=f.name;$('who').textContent=user.email;$('login').style.display='none';$('app').style.display='block';await loadCustomers()}
async function loadCustomers(){const {data,error}=await client.from('customers').select('id,name').eq('firm_id',firmId).order('name');if(error)throw error;const el=$('customers');el.replaceChildren();if(!data.length){el.textContent='Henüz bulutta müşteri yok.';return}for(const c of data){const div=document.createElement('div');div.className='entry';div.textContent=c.name;el.append(div)}}
window.addEventListener('load',async()=>{try{if(!window.supabase?.createClient)throw Error('Bağlantı kütüphanesi yüklenemedi. İnterneti kontrol et.');client=window.supabase.createClient(URL,KEY);await showSession()}catch(e){msg('loginMsg',errorText(e))}});
$('loginBtn').onclick=async()=>{try{if(!client)throw Error('Supabase kütüphanesi yüklenemedi. Sayfayı yenile veya internet bağlantısını kontrol et.');msg('loginMsg','Bağlanıyor...',true);const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await showSession();$('password').value=''}catch(e){msg('loginMsg',errorText(e))}};
$('logout').onclick=async()=>{await client.auth.signOut();firmId=null;$('app').style.display='none';$('login').style.display='block'};
$('add').onclick=async()=>{try{const name=$('customerName').value.trim();if(!name)throw Error('Müşteri adı gir.');const {error}=await client.from('customers').insert({firm_id:firmId,name});if(error)throw error;$('customerName').value='';msg('status','Buluta kaydedildi.',true);await loadCustomers()}catch(e){msg('status',errorText(e))}};
</script></body></html>
